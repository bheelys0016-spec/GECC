<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายสถานี — Smart Rail GECC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1B2D; --panel:#152641; --panel-line:#25395A;
    --cream:#F3EEE1; --cream-dim:#DCD5C2;
    --amber:#E3A857; --amber-dim:#B8863F;
    --signal:#C1443C; --good:#5C8A66; --teal-grey:#8FA1B3;
    --font-th:'Noto Sans Thai', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:var(--font-th); background:#EDE7D8; color:var(--ink); min-height:100vh; }

  .topbar{ background:var(--ink); color:var(--cream); padding:16px 40px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--panel-line); }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-dot{ width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px 1px rgba(227,168,87,0.6); }
  .brand-label{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.12em; color:var(--teal-grey); }
  .nav-tabs{ display:flex; gap:26px; }
  .nav-tab{ font-size:13.5px; color:var(--teal-grey); text-decoration:none; padding-bottom:4px; position:relative; }
  .nav-tab.active{ color:var(--cream); border-bottom:2px solid var(--amber); }
  .nav-tab.soon::after{ content:'เร็วๆ นี้'; font-family:var(--font-mono); font-size:9px; background:var(--panel); color:var(--teal-grey); padding:2px 5px; border-radius:2px; margin-left:7px; }
  .user-chip{ display:flex; align-items:center; gap:12px; }
  .avatar{ width:32px; height:32px; border-radius:50%; background:var(--panel); border:1px solid var(--panel-line); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px; color:var(--amber); }
  .logout-link{ font-size:12.5px; color:var(--teal-grey); text-decoration:none; border-left:1px solid var(--panel-line); padding-left:14px; }
  .logout-link:hover{ color:var(--signal); }

  .page{ max-width:1180px; margin:0 auto; padding:32px 40px 60px; }
  .page-head h1{ font-size:24px; margin:0 0 5px; }
  .page-head p{ margin:0 0 22px; font-size:13px; color:#7A7261; }

  .layout{ display:grid; grid-template-columns:320px 1fr; gap:20px; align-items:start; }

  /* directory list */
  .directory{ background:#FBF9F3; border:1px solid #DFD8C4; border-radius:3px; overflow:hidden; }
  .search-box{ padding:14px 14px 10px; border-bottom:1px solid #E4DDC9; }
  .search-box input{ width:100%; font-family:var(--font-th); font-size:13px; padding:9px 11px; border:1px solid #CFC7B2; border-radius:3px; background:#fff; outline:none; }
  .dir-list{ max-height:560px; overflow-y:auto; }
  .dir-item{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid #EEE9DC; cursor:pointer; }
  .dir-item:hover{ background:#F3EEDD; }
  .dir-item.active{ background:#EFE6CB; }
  .dir-item .name{ font-size:13.5px; font-weight:500; }
  .dir-item .line{ font-size:11px; color:#9A927E; font-family:var(--font-mono); }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .dot.good{ background:var(--good); } .dot.amber{ background:var(--amber); } .dot.bad{ background:var(--signal); }

  /* profile */
  .profile{ background:#FBF9F3; border:1px solid #DFD8C4; border-radius:3px; padding:26px 28px; }
  .profile-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
  .profile-head h2{ font-size:20px; margin:0 0 4px; }
  .profile-head .meta{ font-size:12.5px; color:#8A7F63; }
  .status-pill{ font-size:11.5px; padding:4px 12px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .status-pill.good{ background:rgba(92,138,102,0.14); color:var(--good); }
  .status-pill.amber{ background:rgba(227,168,87,0.16); color:var(--amber-dim); }
  .status-pill.bad{ background:rgba(193,68,60,0.12); color:var(--signal); }

  .photo-placeholder{
    height:150px; border-radius:3px; margin-bottom:20px;
    background:repeating-linear-gradient(135deg, #E4DDC9, #E4DDC9 10px, #ECE6D4 10px, #ECE6D4 20px);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px; color:#9A927E;
  }

  .info-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px; }
  .info-item .label{ font-size:11.5px; color:#9A927E; margin-bottom:4px; }
  .info-item .val{ font-size:14px; font-family:var(--font-mono); }

  .dims h3{ font-size:13.5px; margin:0 0 14px; color:#5B5545; }
  .dim-row{ margin-bottom:14px; }
  .dim-row .dim-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; }
  .dim-top .name{ color:#5B5545; }
  .dim-top .score{ font-family:var(--font-mono); color:var(--ink); }
  .dim-bar{ height:7px; background:#E4DDC9; border-radius:4px; overflow:hidden; }
  .dim-bar-fill{ height:100%; border-radius:4px; background:linear-gradient(90deg, var(--amber-dim), var(--amber)); }

  .realtime-tag{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; color:var(--good); margin-top:2px; }
  .realtime-tag .blip{ width:6px; height:6px; border-radius:50%; background:var(--good); animation:blip 1.6s infinite; }
  @keyframes blip{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  @media (max-width: 860px){
    .layout{ grid-template-columns:1fr; }
    .page{ padding:24px 18px 44px; }
    .nav-tabs{ display:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="brand-dot"></span><span class="brand-label">SMART RAIL · GECC PLATFORM</span></div>
  <div class="nav-tabs">
    <a class="nav-tab" href="gecc-dashboard.html">ภาพรวมประเทศ</a>
    <a class="nav-tab active" href="gecc-station.html">รายสถานี</a>
    <a class="nav-tab" href="gecc-audit.html">ตรวจประเมิน</a>
    <a class="nav-tab" href="gecc-feedback.html">ข้อร้องเรียน</a>
    <a class="nav-tab" href="gecc-report.html">รายงาน</a>
    <a class="nav-tab" href="gecc-innovation.html">นวัตกรรม</a>
  </div>
  <div class="user-chip">
    <div class="avatar">ก</div>
    <a class="logout-link" href="gecc-login.html">ออกจากระบบ</a>
  </div>
</div>

<div class="page">
  <div class="page-head">
    <h1>ระบบข้อมูลเชิงลึกรายสถานี</h1>
    <p>ค้นหาสถานีและดูคะแนน GECC แบบเรียลไทม์ แยกตาม 3 ด้าน: กายภาพ คุณภาพ และผลลัพธ์</p>
  </div>

  <div class="layout">
    <div class="directory">
      <div class="search-box"><input type="text" placeholder="ค้นหาชื่อสถานี..." oninput="filterList(this.value)"></div>
      <div class="dir-list" id="dir-list"></div>
    </div>

    <div class="profile" id="profile"></div>
  </div>
</div>

<script>
const STATIONS = [
  { id:'BKK-004', name:'สถานีกรุงเทพ (หัวลำโพง)', line:'ศูนย์กลาง', status:'good', passengers:'18,400 คน/วัน', coord:'13.7373° N, 100.5175° E',
    dims:{physical:92, quality:88, outcome:85} },
  { id:'AYA-011', name:'สถานีอยุธยา', line:'สายเหนือ', status:'good', passengers:'4,120 คน/วัน', coord:'14.3532° N, 100.5684° E',
    dims:{physical:81, quality:79, outcome:83} },
  { id:'PLK-018', name:'สถานีพิษณุโลก', line:'สายเหนือ', status:'amber', passengers:'2,860 คน/วัน', coord:'16.8211° N, 100.2659° E',
    dims:{physical:68, quality:62, outcome:70} },
  { id:'NMA-022', name:'สถานีนครราชสีมา', line:'สายอีสาน', status:'bad', passengers:'3,340 คน/วัน', coord:'14.9799° N, 102.0977° E',
    dims:{physical:44, quality:39, outcome:52} },
  { id:'UBN-030', name:'สถานีอุบลราชธานี', line:'สายอีสาน', status:'bad', passengers:'2,110 คน/วัน', coord:'15.2286° N, 104.8564° E',
    dims:{physical:41, quality:47, outcome:50} },
  { id:'PBI-014', name:'สถานีเพชรบุรี', line:'สายใต้', status:'bad', passengers:'1,780 คน/วัน', coord:'13.1119° N, 99.9438° E',
    dims:{physical:48, quality:45, outcome:55} },
  { id:'SRT-027', name:'สถานีสุราษฎร์ธานี', line:'สายใต้', status:'amber', passengers:'2,540 คน/วัน', coord:'9.1382° N, 99.3215° E',
    dims:{physical:64, quality:66, outcome:60} },
  { id:'HDY-033', name:'สถานีหาดใหญ่', line:'สายใต้', status:'bad', passengers:'3,020 คน/วัน', coord:'7.0086° N, 100.4747° E',
    dims:{physical:50, quality:53, outcome:49} },
];

let activeId = STATIONS[0].id;

function statusLabel(s){
  return s === 'good' ? 'ผ่านมาตรฐาน GECC' : s === 'amber' ? 'รอตรวจประเมิน' : 'ต้องปรับปรุงเร่งด่วน';
}

function renderList(filter=''){
  const listEl = document.getElementById('dir-list');
  listEl.innerHTML = '';
  STATIONS.filter(s => s.name.includes(filter)).forEach(s => {
    const div = document.createElement('div');
    div.className = 'dir-item' + (s.id === activeId ? ' active' : '');
    div.onclick = () => { activeId = s.id; renderList(document.querySelector('.search-box input').value); renderProfile(); };
    div.innerHTML = `
      <div>
        <div class="name">${s.name}</div>
        <div class="line">${s.line} · ${s.id}</div>
      </div>
      <span class="dot ${s.status}"></span>
    `;
    listEl.appendChild(div);
  });
}

function filterList(val){ renderList(val); }

function renderProfile(){
  const s = STATIONS.find(x => x.id === activeId);
  const overall = Math.round((s.dims.physical + s.dims.quality + s.dims.outcome)/3);
  document.getElementById('profile').innerHTML = `
    <div class="profile-head">
      <div>
        <h2>${s.name}</h2>
        <div class="meta">${s.line} · รหัสสถานี ${s.id}</div>
      </div>
      <span class="status-pill ${s.status}">${statusLabel(s.status)}</span>
    </div>

    <div class="photo-placeholder">ภาพถ่ายสถานี (ยังไม่อัปโหลด)</div>

    <div class="info-grid">
      <div class="info-item"><div class="label">พิกัดแผนที่</div><div class="val">${s.coord}</div></div>
      <div class="info-item"><div class="label">ปริมาณผู้โดยสาร</div><div class="val">${s.passengers}</div></div>
      <div class="info-item"><div class="label">คะแนนรวม GECC</div><div class="val">${overall} / 100</div></div>
    </div>

    <div class="dims">
      <h3>คะแนนแยกตาม 3 ด้าน <span class="realtime-tag"><span class="blip"></span>เรียลไทม์</span></h3>
      <div class="dim-row">
        <div class="dim-top"><span class="name">ด้านกายภาพ (สถานที่ / สิ่งอำนวยความสะดวก)</span><span class="score">${s.dims.physical}</span></div>
        <div class="dim-bar"><div class="dim-bar-fill" style="width:${s.dims.physical}%"></div></div>
      </div>
      <div class="dim-row">
        <div class="dim-top"><span class="name">ด้านคุณภาพการให้บริการ</span><span class="score">${s.dims.quality}</span></div>
        <div class="dim-bar"><div class="dim-bar-fill" style="width:${s.dims.quality}%"></div></div>
      </div>
      <div class="dim-row">
        <div class="dim-top"><span class="name">ด้านผลลัพธ์ / ความพึงพอใจ</span><span class="score">${s.dims.outcome}</span></div>
        <div class="dim-bar"><div class="dim-bar-fill" style="width:${s.dims.outcome}%"></div></div>
      </div>
    </div>
  `;
}

renderList();
renderProfile();
</script>

</body>
</html>
